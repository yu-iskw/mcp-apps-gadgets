name: Diagnose PR 4

on:
  push:
    branches:
      - feat/mcp-connections-oauth

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/mcp-connections-oauth
      - run: corepack enable
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 11.1.2
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture ESLint and formatting diagnostics
        run: |
          (pnpm lint:eslint || true) > eslint-debug.txt 2>&1
          (pnpm exec prettier --check . || true) > prettier-debug.txt 2>&1
      - name: Capture E2E diagnostics
        run: |
          docker compose up -d --build gadget-host demo-mcp-app oauth-demo-mcp-app
          (docker compose --profile e2e run --rm e2e || true) > e2e-debug.txt 2>&1
          docker compose logs >> e2e-debug.txt 2>&1 || true
          docker compose down --volumes --remove-orphans
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *-debug.txt
          git commit -m "chore: capture PR diagnostics" || exit 0
          git push origin HEAD:feat/mcp-connections-oauth
