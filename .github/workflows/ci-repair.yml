name: CI repair

on:
  push:
    branches: [feat/experimental-mcp-app-gadget-host]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/experimental-mcp-app-gadget-host
          persist-credentials: true
      - name: Enable Corepack
        run: corepack enable
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.1.2
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
      - name: Apply CI fixes
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "packages/gadget-host/src/main.ts",
              "      id: crypto.randomUUID(),",
              """      id: Array.from(crypto.getRandomValues(new Uint32Array(4)), (value) =>\n        value.toString(16).padStart(8, '0'),\n      ).join(''),""",
          )

          replace("README.md", "Then open <http://localhost:8080>.", "Then open `http://localhost:8080`.")

          compose = Path("docker-compose.yml")
          text = compose.read_text()
          for old, new in [
              ("'8080:8080'", "8080:8080"),
              ("'8081:8081'", "8081:8081"),
              ("PORT: '3001'", "PORT: 3001"),
              ("'3001:3001'", "3001:3001"),
              ("profiles: ['e2e']", "profiles: [e2e]"),
              ("BASE_URL: 'http://gadget-host:8080'", "BASE_URL: http://gadget-host:8080"),
          ]:
              text = text.replace(old, new)
          compose.write_text(text)

          workspace = Path("pnpm-workspace.yaml")
          text = workspace.read_text()
          needle = "  brace-expansion: 5.0.9\n"
          if "nanoid: 3.3.17" not in text:
              if needle not in text:
                  raise SystemExit("brace-expansion override anchor not found")
              text = text.replace(
                  needle,
                  needle + "  # GHSA-2v37-7h3g-55p8 fixed in 3.3.17+ on the 3.x line\n  nanoid: 3.3.17\n",
              )
          workspace.write_text(text)

          eslint = Path("eslint.config.mjs")
          text = eslint.read_text()
          anchor = "  {\n    files: ['**/*.js'],"
          e2e_config = """  {\n    files: ['tests/e2e/**/*.ts'],\n    languageOptions: {\n      parser: tsparser,\n      parserOptions: {\n        ecmaVersion: 2022,\n        sourceType: 'module',\n      },\n    },\n    plugins: {\n      ...importXPlugins,\n      ...securityRecommended.plugins,\n      '@typescript-eslint': tseslint,\n      unicorn,\n    },\n    settings: importXSettings,\n    rules: {\n      ...importXRules,\n      ...securityRecommended.rules,\n      ...tseslint.configs.recommended.rules,\n      '@typescript-eslint/no-explicit-any': 'error',\n      '@typescript-eslint/no-unused-vars': ['error', { argsIgnorePattern: '^_' }],\n      'no-eval': 'error',\n      'no-implied-eval': 'error',\n      'no-new-func': 'error',\n      'no-unreachable': 'error',\n      'prefer-const': 'error',\n      'unicorn/filename-case': unicornFilenameCase,\n    },\n  },\n"""
          if "files: ['tests/e2e/**/*.ts']" not in text:
              if anchor not in text:
                  raise SystemExit("ESLint insertion anchor not found")
              text = text.replace(anchor, e2e_config + anchor, 1)
          eslint.write_text(text)
          PY
      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Format repository
        run: pnpm exec trunk fmt --all
      - name: ESLint autofix
        run: pnpm exec eslint . --fix
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair remaining CI failures"
          git push
