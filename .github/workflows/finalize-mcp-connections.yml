name: Finalize MCP connections

on:
  push:
    branches:
      - feat/mcp-connections-oauth

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/mcp-connections-oauth
      - run: python scripts/finalize-mcp-connections.py
      - run: corepack enable
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 11.1.2
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write packages/gadget-host/src/main.ts packages/gadget-host/src/oauth.ts packages/gadget-host/index.html packages/oauth-demo-mcp-app tests/e2e/gadgets.spec.ts tests/e2e/playwright.config.ts
      - run: pnpm lint:eslint
      - run: pnpm knip
      - run: pnpm build
      - name: Run Compose E2E
        run: |
          docker compose up -d --build gadget-host demo-mcp-app oauth-demo-mcp-app
          docker compose --profile e2e run --rm e2e
          docker compose down --volumes --remove-orphans
      - name: Remove temporary diagnostics and finalizer
        run: |
          rm -f eslint-debug.txt prettier-debug.txt e2e-debug.txt
          rm -f scripts/finalize-mcp-connections.py
          rm -f .github/workflows/finalize-mcp-connections.yml
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize OAuth connection lifecycle" || exit 0
          git push origin HEAD:feat/mcp-connections-oauth
