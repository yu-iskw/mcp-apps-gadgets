<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP App Gadgets</title>
  </head>
  <body>
    <main>
      <header class="page-header">
        <div>
          <p class="eyebrow">Experimental MCP Apps host</p>
          <h1>MCP App Gadgets</h1>
          <p>Compose a workspace from independently deployed MCP Apps.</p>
        </div>
        <div class="workspace-actions" aria-label="Workspace actions">
          <button id="export-workspace" type="button">Export</button>
          <button id="import-workspace" type="button">Import</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </div>
      </header>

      <section class="composer" id="composer">
        <label>Server URL <input id="server-url" value="http://localhost:3001/mcp" /></label>
        <label
          >Authentication
          <select id="auth-mode">
            <option value="none">None</option>
            <option value="oauth">OAuth</option>
          </select>
        </label>
        <button id="connect" type="button">Trust & discover apps</button>
        <button id="clear-oauth" type="button">Clear OAuth session</button>
        <label
          >Tool
          <select id="tool" disabled>
            <option>Connect first</option>
          </select></label
        >
        <label>Tile title <input id="tile-title" value="Demo metric" /></label>
        <label class="wide"
          >Arguments (JSON)<textarea id="arguments" rows="4">
{"title":"Requests","value":1284,"unit":"/ min"}</textarea
          >
        </label>
        <div class="composer-actions">
          <button id="add" type="button" disabled>Add gadget</button>
          <button id="cancel-edit" type="button" hidden>Cancel edit</button>
        </div>
        <output id="status"></output>
      </section>

      <section id="grid" class="grid" aria-live="polite"></section>
    </main>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
