<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP App Gadgets</title>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Experimental MCP Apps host</p>
          <h1>MCP App Gadgets</h1>
          <p>Compose a dashboard from independently deployed MCP Apps.</p>
        </div>
      </header>

      <section class="composer">
        <label>Server URL <input id="server-url" value="http://localhost:3001/mcp" /></label>
        <button id="connect" type="button">Discover apps</button>
        <label
          >Tool
          <select id="tool" disabled>
            <option>Connect first</option>
          </select></label
        >
        <label>Tile title <input id="tile-title" value="Demo metric" /></label>
        <label class="wide"
          >Arguments (JSON)<textarea id="arguments" rows="4">
{"title":"Requests","value":1284,"unit":"/ min"}</textarea>
        </label>
        <button id="add" type="button" disabled>Add gadget</button>
        <output id="status"></output>
      </section>

      <section id="grid" class="grid" aria-live="polite"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
